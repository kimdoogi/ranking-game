<body>
<canvas id="game"></canvas>

<div id="utilBar">
  <a href="index.html" title="게임 목록" aria-label="게임 목록으로 돌아가기">🏠</a>
  <button id="muteBtn" type="button" aria-pressed="false" aria-label="소리 끄기" title="소리 끄기">🔊</button>
</div>

<div id="hud" hidden>
  <div class="pill">🏃 남은 인원 <span class="big" id="aliveCount">0</span></div>
  <div id="snackStatus" class="pill"></div>
</div>
<div id="snackCombo" role="status" aria-live="polite" hidden></div>
<section id="chaseFeed" hidden><strong id="chaseHeadline"></strong>
<div id="chaseLog" role="log" aria-live="polite" aria-relevant="additions"></div></section>

<div id="countdown"></div>

<div class="overlay" id="startScreen">
  <div class="title">먹보 괴물<br>대탈주</div>
  <div class="subtitle">먹히지 마라! 마지막 생존자가 우승 🏆
    <span class="tagline">사다리게임·룰렛 대신 쓰는 이름 뽑기 — 벌칙·순서 정하기</span>
  </div>
<p class="arenaIntro">🍔 야식이 떨어지면 추격전도 반전!<br>자동 야식 배달과 최후의 추격전, 끝까지 살아남을 이름은?</p>
  <div class="control">
    <label>참가자 추가 <span class="hint"><b>이름 * 4</b> 처럼 입력하고 추가하기 · 중복 OK</span></label>
    <div class="addRow">
      <input id="nameInput" type="text" placeholder="예: 김두기 * 4" autocomplete="off" />
      <button id="addBtn" class="addBtn">추가하기</button>
    </div>
    <div class="rosterWrap">
      <div class="rosterList" id="rosterList"></div>
      <div class="rosterFoot">
        <span class="lobbyCount"><span id="countVal">0</span>명</span>
        <button id="clearBtn" class="clearBtn">전체 지우기</button>
      </div>
    </div>
    <div class="lobbyHint" id="lobbyHint"></div>
  </div>
  <button class="playBtn" id="startBtn">▶ 시작!</button>
<button class="demoBtn" id="demoBtn" type="button">12명으로 구경하기</button>
</div>

<div class="overlay hidden" id="winScreen">
  <div class="crown">👑</div>
  <div style="font-weight:800;color:#b8b8d8;letter-spacing:2px;">WINNER</div>
  <div id="winName">-</div>
  <ul class="rankList" id="rankList"></ul>
  <button class="playBtn win" id="againBtn">🔄 다시하기</button>
</div>
