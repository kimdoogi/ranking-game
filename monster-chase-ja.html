<body>
<canvas id="game"></canvas>

<div id="utilBar">
  <a href="index-ja.html" title="ゲーム一覧" aria-label="ゲーム一覧に戻る">🏠</a>
  <button id="muteBtn" type="button" aria-pressed="false" aria-label="ミュート" title="ミュート">🔊</button>
</div>

<div id="hud">
  <div class="pill">🏃 残り <span class="big" id="aliveCount">0</span></div>
  <button id="boomBtn" type="button" aria-keyshortcuts="Space" aria-describedby="snackHelp">🍔 夜食投げ ×3</button>
</div>
<div id="snackCombo" role="status" aria-live="polite" hidden></div>
<span id="snackHelp" class="srOnly">試合中にボタンかスペースキーを押すと、モンスターに夜食を投げます。1試合で3回まで使えます。</span>

<div id="countdown"></div>

<div class="overlay" id="startScreen">
  <div class="title">大食いモンスター<br>から大脱走</div>
  <div class="subtitle">食べられるな！最後の生存者が優勝 🏆
    <span class="tagline">あみだくじ・ルーレット代わりの名前抽選 — 罰ゲームや順番決めに</span>
  </div>
  <div class="control">
    <label>参加者を追加 <span class="hint"><b>名前 * 4</b> の形で入力して追加 · 重複OK</span></label>
    <div class="addRow">
      <input id="nameInput" type="text" placeholder="例：たろう * 4" autocomplete="off" />
      <button id="addBtn" class="addBtn">追加</button>
    </div>
    <div class="rosterWrap">
      <div class="rosterList" id="rosterList"></div>
      <div class="rosterFoot">
        <span class="lobbyCount"><span id="countVal">0</span>人</span>
        <button id="clearBtn" class="clearBtn">すべて消す</button>
      </div>
    </div>
    <div class="lobbyHint" id="lobbyHint"></div>
  </div>
  <button class="playBtn" id="startBtn">▶ スタート！</button>
</div>

<div class="overlay hidden" id="winScreen">
  <div class="crown">👑</div>
  <div style="font-weight:800;color:#b8b8d8;letter-spacing:2px;">WINNER</div>
  <div id="winName">-</div>
  <ul class="rankList" id="rankList"></ul>
  <button class="playBtn win" id="againBtn">🔄 もう一回</button>
</div>
