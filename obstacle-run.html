<body>
<canvas id="game"></canvas>

<div id="utilBar">
  <a href="index.html" title="게임 목록" aria-label="게임 목록으로 돌아가기">🏠</a>
  <button id="muteBtn" type="button" aria-pressed="false" aria-label="소리 끄기" title="소리 끄기">🔊</button>
</div>

<div id="hud">
  <div class="pill">🏁 완주 <span class="big" id="finCount">0</span><span id="totCount" style="opacity:.6">/300</span></div>
  <button id="boomBtn">🍌 바나나 비 ×3</button>
</div>
<div id="ffChip">⏩ ×3 빨리감기</div>
<div id="ticker"></div>

<div id="countdown"></div>

<div class="overlay" id="startScreen">
  <div class="title">장애물<br>대탈주</div>
  <div class="subtitle">해머, 크러셔, 진흙탕을 뚫고 결승선까지! 최대 300명 🏁
    <span class="tagline">사다리게임·룰렛 대신 쓰는 순위 뽑기 — 순서·벌칙·팀 나누기</span>
  </div>
  <div class="control">
    <label>참가자 추가 <span class="hint"><b>이름 * 4</b> 처럼 입력하고 추가하기 · 최대 300명</span></label>
    <div class="addRow">
      <input id="nameInput" type="text" placeholder="예: 김두기 * 4" autocomplete="off" />
      <button id="addBtn" class="addBtn">추가하기</button>
    </div>
    <div class="presets">
      <button class="preset" data-n="12">봇 +12</button>
      <button class="preset" data-n="50">봇 +50</button>
      <button class="preset" data-n="100">봇 +100</button>
      <button class="preset" data-n="300">봇 +300</button>
    </div>
    <div class="rosterWrap">
      <div class="rosterList" id="rosterList"></div>
      <div class="rosterFoot">
        <span class="lobbyCount"><span id="countVal">0</span>명</span>
        <button id="clearBtn" class="clearBtn">전체 지우기</button>
      </div>
    </div>
    <div class="lobbyHint" id="lobbyHint"></div>
  </div>
  <button class="playBtn" id="startBtn">▶ 출발!</button>
</div>

<div class="overlay hidden" id="winScreen">
  <div class="crown">🏆</div>
  <div style="font-weight:800;color:#b8b8d8;letter-spacing:2px;">WINNER</div>
  <div id="winName">-</div>
  <ul class="rankList" id="rankList"></ul>
  <button class="playBtn win" id="againBtn">🔄 다시하기</button>
</div>

<script>
window.T = {
  mute: '소리 끄기',

  reviewing: '판독중…',
