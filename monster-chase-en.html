<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "VideoGame",

<body>
<canvas id="game"></canvas>

<div id="utilBar">
  <a href="index-en.html" title="Game list" aria-label="Back to the game list">🏠</a>
  <button id="muteBtn" type="button" aria-pressed="false" aria-label="Mute" title="Mute">🔊</button>
</div>

<div id="hud">
  <div class="pill">🏃 Left <span class="big" id="aliveCount">0</span></div>
  <button id="boomBtn" type="button" aria-keyshortcuts="Space" aria-describedby="snackHelp">🍔 Throw snack ×3</button>
</div>
<div id="snackCombo" role="status" aria-live="polite" hidden></div>
<span id="snackHelp" class="srOnly">During a match, press the button or the space key to throw a snack at the monster. Three uses per match.</span>

<div id="countdown"></div>

<div class="overlay" id="startScreen">
  <div class="title">Monster Munch<br>Escape</div>
  <div class="subtitle">Don't get eaten! The last survivor wins 🏆
    <span class="tagline">A random name picker instead of a ladder game or roulette wheel — penalties and turn order</span>
  </div>
  <div class="control">
    <label>Add players <span class="hint">type <b>name * 4</b> and hit Add · duplicates OK</span></label>
    <div class="addRow">
      <input id="nameInput" type="text" placeholder="e.g. Alex * 4" autocomplete="off" />
      <button id="addBtn" class="addBtn">Add</button>
    </div>
    <div class="rosterWrap">
      <div class="rosterList" id="rosterList"></div>
      <div class="rosterFoot">
        <span class="lobbyCount"><span id="countVal">0</span> players</span>
        <button id="clearBtn" class="clearBtn">Clear all</button>
      </div>
    </div>
    <div class="lobbyHint" id="lobbyHint"></div>
  </div>
  <button class="playBtn" id="startBtn">▶ Start!</button>
</div>

<div class="overlay hidden" id="winScreen">
  <div class="crown">👑</div>
  <div style="font-weight:800;color:#b8b8d8;letter-spacing:2px;">WINNER</div>
  <div id="winName">-</div>
  <ul class="rankList" id="rankList"></ul>
  <button class="playBtn win" id="againBtn">🔄 Play again</button>
</div>

<script>
window.T = {
  mute: 'Mute',
  unmute: 'Unmute',
  snack1: '2 a.m. burger', snack1r: 'The diet starts tomorrow!',
  snack2: 'Mint choco pizza', snack2r: 'That combo... seriously?',
  snack3: '10x fire noodles', snack3r: 'HOT HOT HOT!!!',

  snack5: 'Rainbow donut', snack5r: 'Sugar rush complete!',

  snackGone: 'Gone in one bite!',
  nom: 'NOM!',
  firstNom: 'First bite!',
  darkNom: 'A bite in the dark!',
  suddenDeath: '⚡ SUDDEN DEATH!!',
  pillarFall: 'Pillar collapse!',
  finalTwo: 'FINAL TWO!',
  deliveryFail: 'Delivery failed!',
  closeCall: 'Close call!',
  survived: 'Made it!',
  doubleNom: 'DOUBLE NOM!!',
  tripleNom: 'TRIPLE NOM!!!',
  bonk: 'BONK~',
  oops: 'Oops!',
  monsterWoke: 'The monster woke up!',
  throwSnack: n => `🍔 Throw snack ×${n}`,
  delivering: 'Delivering…',
  snackSoldOut: '🍽️ Snacks sold out',
  seconds: n => `${n}s`,
  snackCooldown: n => `${n}s until the next snack throw`,
  delivered: 'Delivered!',
  rosterEmpty: 'No players yet',
  hintEmpty: 'Type a name and hit Add',
  hintReady: n => `${n} players — ready to start!`,
  hintNeedMore: n => `Needs at least ${n} players to start`,
  numName: n => '#' + n
};
</script>
